<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1d2433;">
  <h2 style="margin: 0 0 8px; color: #5b5bd6;">NoteTron</h2>
  <p style="margin: 0 0 16px;">Use o código abaixo para confirmar que é você e continuar no NoteTron:</p>

  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center; background: #eef0f6; border-radius: 10px; padding: 16px; margin: 0 0 16px;">{{ .Token }}</p>

  <p style="margin: 0 0 16px;">Ou, se estiver neste mesmo aparelho, clique no botão:</p>
  <p style="text-align: center; margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #5b5bd6; color: #ffffff; text-decoration: none; font-weight: bold; padding: 12px 24px; border-radius: 8px;">Confirmar no NoteTron</a>
  </p>

  <p style="font-size: 13px; color: #6b7385; margin: 0;">O código e o link valem por pouco tempo e só podem ser usados uma vez. Se não foi você que pediu, ignore este e-mail.</p>
</div>
